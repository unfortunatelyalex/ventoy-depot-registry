name: Registry CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python scripts/validate_registry.py
      - name: Reject private key material
        run: '! find . -type f \( -name "*.key" -o -name "*.pem" -o -name "*.sec" -o -name "*.kbx" \) -print -quit | grep .'

